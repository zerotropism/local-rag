[project]
name = "local-rag"
version = "0.1.0"
description = "A local RAG pipeline with swappable embedder and vector store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "ollama>=0.6.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "truststore>=0.10.4",
]

[project.scripts]
local-rag = "local_rag.cli:main"
local-rag-eval = "local_rag.evaluation:main"
local-rag-mcp = "local_rag.server:main"

[project.optional-dependencies]
sentence-transformers = [
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
