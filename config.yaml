data:
  path: "data/top_rated_wines.csv"
  text_field: ["name", "region", "variety", "notes"]
  required_fields: ["variety"]
# lexical (BM25, the default: best on the evaluation, no model), dense or hybrid
retrieval: "lexical"
evaluation:
  path: "data/eval.jsonl"
  id_field: "name"
vectordb:
  # "sentence-transformers:<model>" or "ollama:<model>"
  encoder: "sentence-transformers:all-MiniLM-L6-v2"
  location: ":memory:"
  collection_name: "top_wines"
chatbot:
  theme: "wine"
  initial_template: >
    You are a wine specialist. Answer using only the search results provided below.
    Never mention a wine that is not in those results.
    If the results do not contain a suitable wine, say so plainly and describe
    what is closest among them.
  llm_model: "llama3.2:3b"
